[project]
name = "usb-radio-gui"
version = "0.1.0"
description = ""
authors = [
    {name = "Michael Zappe",email = "zapman@pi-rad.io"}
]
requires-python = ">=3.14,<4"
dependencies = [
    "matplotlib (>=3.11.1,<4.0.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "nicegui (>=3.15.0,<4.0.0)",
    "pywebview (>=6.2.1,<7.0.0)",
    "pyqt6 (>=6.11.0,<7.0.0)",
    "qtpy (>=2.4.3,<3.0.0)",
    "pyqt6-webengine (>=6.11.0,<7.0.0)",
    "libusb (>=1.0.29.post7,<2.0.0)",
    "pyusb (>=1.3.1,<2.0.0)",
    "scikit-rf (>=2.0.1,<3.0.0)",
    "plotly (>=6.9.0,<7.0.0)",
    "anywidget (>=0.11.0,<0.12.0)",
    "scipy (>=1.18.0,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "setuptools (>=83.0.0,<84.0.0)"
